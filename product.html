<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details - Heady</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
        "htm": "https://esm.sh/htm@3.1.1",
        "config": "./src/config.js"
      }
    }
  </script>
</head>
<body class="bg-[#18181b] text-white antialiased">
  <div id="root"></div>

  <script type="module">
    import React, { useEffect } from 'react';
    import ReactDOM from 'react-dom/client';
    import { BrowserRouter, Routes, Route } from 'react-router-dom';
    import htm from 'htm';
    import ProductDetailsPage from './src/pages/customer/ProductDetailsPage.js';

    const html = htm.bind(React.createElement);

    // Redirect Components back to index.html
    const RedirectToHome = () => {
      useEffect(() => {
        window.location.href = 'index.html';
      }, []);
      return null;
    };

    const RedirectToShop = () => {
      useEffect(() => {
        window.location.href = 'index.html'; // Adjust to 'index.html#shop' if targeting a specific section
      }, []);
      return null;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(html`
      <${BrowserRouter}>
        <${Routes}>
          <${Route} path="/" element=${html`<${RedirectToHome} />`} />
          <${Route} path="/shop" element=${html`<${RedirectToShop} />`} />
          <${Route} path="*" element=${html`<${ProductDetailsPage} />`} />
        <//>
      <//>
    `);
  </script>
</body>
</html>
